# Смоук-тесты — самодостаточные скрипты (jiti + стаб ExtensionAPI): без tmux и
# без моделей. Сеть нужна только e2e-проверке ui-review: она гоняет реальный
# chromium (playwright ставится вместе с npm ci, системные библиотеки — шагом
# ниже) и axe-core из node_modules. bubblewrap ставится, чтобы sandbox e2e-проверки
# выполнялись, а не пропускались; если user namespaces в раннере не работают,
# проверки печатают skip и прогон остаётся зелёным (см. hasBwrap в smoke.test.mjs).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: smoke tests (node 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: bubblewrap для sandbox e2e
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Системные библиотеки chromium для ui e2e
        # Без них chromium не стартует, и ui-skills e2e печатают skip (exit 4) —
        # прогон остаётся зелёным, как sandbox без bwrap.
        continue-on-error: true
        run: sudo npx playwright install-deps chromium
      - name: Test
        # npm test is a `for f in ...; do node $f || exit 1; done` loop, so a
        # red run otherwise shows only "exit code 1". Capture the full output
        # and mirror the tail into annotations — annotations are public on
        # public repos, so failures stay debuggable without dashboard access.
        run: |
          set +e
          npm test > /tmp/test-output.log 2>&1
          code=$?
          set -e
          tail -n 40 /tmp/test-output.log
            # GitHub truncates annotation messages at a few thousand chars —
            # send the last 25 lines (line-based, the interesting part).
          if [ "$code" -ne 0 ]; then
            tail -n 25 /tmp/test-output.log | sed 's/%/%25/g' | awk '{out = out $0 "%0A"} END {sub(/%0A$/, "", out); print "::error::" out}'
            exit "$code"
          fi
